server {
    listen 8080;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/invora-tls/fullchain.pem;
    ssl_certificate_key /etc/invora-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
        add_header Cache-Control no-store always;
    }
    location /health/ { proxy_pass http://api:8080; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|woff2)$ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control no-cache; }
}
